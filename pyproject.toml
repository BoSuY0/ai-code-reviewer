[project]
name = "ai-code-reviewer"
version = "1.0.0"
description = "FastAPI service that combines flake8, mypy and an LLM into one code review"
requires-python = ">=3.10"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"

[tool.coverage.run]
branch = true
source = ["src"]
